name: Branch Protection Enforcement

on:
  push:
    branches:
      - v2
      - main
  pull_request:
    branches:
      - v2
      - main
    types: [opened, synchronize, reopened]

jobs:
  # BLOCK 1: Prevent direct pushes to protected branches
  prevent-direct-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, 'Merge pull request')
    steps:
      - name: ❌ Block Direct Push
        run: |
          echo "ERROR: Direct pushes to v2/main are not allowed!"
          echo "Please create a feature branch and open a Pull Request."
          echo ""
          echo "Workflow:"
          echo "  1. git checkout -b feature/your-change"
          echo "  2. git commit -m 'your message'"
          echo "  3. git push origin feature/your-change"
          echo "  4. Open PR on GitHub"
          exit 1

  # BLOCK 2: Validate PR requirements
  validate-pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ✅ PR Validation
        run: |
          echo "PR Title: ${{ github.event.pull_request.title }}"
          echo "PR Author: ${{ github.event.pull_request.user.login }}"
          echo "Branch: ${{ github.head_ref }} → ${{ github.base_ref }}"
          echo ""
          echo "✅ PR validation passed - awaiting review"

  # BLOCK 3: Run tests on PR
  test-pr:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint --if-present

      - name: Run TypeScript check
        run: npx tsc --noEmit --project tsconfig.json
        continue-on-error: true

      - name: ✅ Tests Complete
        run: echo "All checks passed!"

  # BLOCK 4: Allow merge commits
  allow-merge:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Merge pull request')
    steps:
      - name: ✅ Merge Commit Approved
        run: |
          echo "PR merge detected - allowing push to protected branch"
          echo "Merged by: ${{ github.actor }}"
